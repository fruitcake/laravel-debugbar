name: Unit Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'
  schedule:
    - cron: '0 0 * * *'

jobs:
  unit-tests:
    runs-on: ubuntu-24.04

    timeout-minutes: 15

    env:
      COMPOSER_NO_INTERACTION: 1

    strategy:
      fail-fast: false
      matrix:
        php: [8.6, 8.5, 8.4, 8.3, 8.2]
        laravel: [^11, ^12, ^13]
        dependency-version: [prefer-stable]
        exclude:
          - laravel: ^13
            php: 8.2

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif

      - name: Remove incompatible Laravel dependencies
        if: matrix.laravel == '^13'
        run: |
            composer remove --dev --no-update laravel/octane laravel/pennant

      - name: Remove incompatible PHP dependencies
        if: matrix.php == '8.2' || matrix.laravel == '^11'
        run: |
            composer remove --dev --no-update laravel/ai
            
      - name: Install dependencies
        run: |
          composer remove --dev --no-update larastan/larastan phpstan/phpstan-phpunit laravel/pint phpstan/phpstan-strict-rules shipmonk/phpstan-rules
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-progress

      - name: Update Dusk Chromedriver
        run: vendor/bin/dusk-updater detect --auto-update

      - name: Execute Unit Tests
        run: composer test

      - name: Upload Failed Screenshots
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: screenshots
          path: tests/Browser/screenshots/*

  ai-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        ai: ['^0.8', '^0.11', '^1.0']

    name: AI SDK ${{ matrix.ai }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: mbstring, pdo_sqlite

      - name: Install dependencies
        run: |
          composer require --dev "laravel/ai:${{ matrix.ai }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Execute AI Collector Tests
        run: composer test -- --filter=AiCollectorTest
